openapi: 3.0.3
info:
  title: Authentication and Account API
  version: 1.0.0
  description: |
    API contract implementing FR-A1 through FR-A12 for authentication,
    credential management, MFA, and API key lifecycle.

servers:
  - url: https://api.example.com

paths:
  /api/auth/register:
    post:
      summary: Register a new user account
      operationId: registerUser
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '409':
          description: Duplicate account rejected deterministically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeterministicErrorResponse'
        '422':
          description: Rejected due to active password rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeterministicErrorResponse'

  /api/auth/login:
    post:
      summary: Login using username/email and password
      operationId: loginUser
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: First-factor authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeterministicErrorResponse'

  /api/auth/refresh:
    post:
      summary: Refresh authenticated session token
      operationId: refreshSession
      tags: [Auth]
      responses:
        '200':
          description: Session token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: No valid authenticated session context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeterministicErrorResponse'

  /api/auth/logout:
    post:
      summary: Logout current session
      operationId: logoutUser
      tags: [Auth]
      responses:
        '200':
          description: Logout confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /api/auth/change-password:
    post:
      summary: Change account password
      operationId: changePassword
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '422':
          description: Rejected due to active password rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeterministicErrorResponse'

  /api/auth/reset-request:
    post:
      summary: Initiate password reset
      operationId: requestPasswordReset
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetRequest'
      responses:
        '200':
          description: Reset-request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /api/auth/reset-confirm:
    post:
      summary: Confirm password reset with token
      operationId: confirmPasswordReset
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetConfirmRequest'
      responses:
        '200':
          description: Password reset completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '422':
          description: Rejected due to token or password-rule failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeterministicErrorResponse'

  /api/admin/accounts/password-rules:
    get:
      summary: Get active password rules
      operationId: getPasswordRules
      tags: [Admin]
      responses:
        '200':
          description: Active rules returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordRules'
    put:
      summary: Update active password rules
      operationId: setPasswordRules
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRules'
      responses:
        '200':
          description: Rules updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /api/auth/mfa/challenge:
    post:
      summary: Generate and dispatch MFA challenge code via external REST gateway
      operationId: createMfaChallenge
      tags: [MFA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaChallengeRequest'
      responses:
        '200':
          description: Challenge generated and dispatch attempted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /api/auth/mfa/verify:
    post:
      summary: Verify MFA passcode and complete authentication
      operationId: verifyMfaChallenge
      tags: [MFA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: MFA verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaVerifyResponse'

  /api/auth/api-keys:
    post:
      summary: Issue API key for external integration
      operationId: issueApiKey
      tags: [API Keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreateRequest'
      responses:
        '201':
          description: API key issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyResponse'
    get:
      summary: List API keys and statuses
      operationId: listApiKeys
      tags: [API Keys]
      responses:
        '200':
          description: API keys returned
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKeyMetadata'

  /api/auth/api-keys/{keyId}:
    delete:
      summary: Revoke an API key
      operationId: revokeApiKey
      tags: [API Keys]
      parameters:
        - in: path
          name: keyId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: API key revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '404':
          description: API key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeterministicErrorResponse'

components:
  schemas:
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 3 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    RegisterResponse:
      type: object
      required: [accountId, status]
      properties:
        accountId: { type: string }
        status:
          type: string
          enum: [REGISTERED]

    LoginRequest:
      type: object
      required: [identity, password]
      properties:
        identity:
          description: Username or email
          type: string
        password: { type: string }

    LoginResponse:
      type: object
      required: [status, token]
      properties:
        status:
          type: string
          enum: [AUTHENTICATED, MFA_REQUIRED]
        token:
          type: string
          description: Session token or pre-auth token when MFA is required

    TokenResponse:
      type: object
      required: [token, status]
      properties:
        token: { type: string }
        status:
          type: string
          enum: [REFRESHED]

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string }

    ResetRequest:
      type: object
      required: [identity]
      properties:
        identity:
          description: Email or username
          type: string

    ResetConfirmRequest:
      type: object
      required: [resetToken, newPassword]
      properties:
        resetToken: { type: string }
        newPassword: { type: string }

    PasswordRules:
      type: object
      required: [minLength, requireUppercase, requireLowercase, requireNumber, requireSymbol]
      properties:
        minLength:
          type: integer
          minimum: 8
          maximum: 128
        requireUppercase: { type: boolean }
        requireLowercase: { type: boolean }
        requireNumber: { type: boolean }
        requireSymbol: { type: boolean }
        blockedPasswords:
          type: array
          items: { type: string }

    MfaChallengeRequest:
      type: object
      required: [preAuthToken, deliveryTarget]
      properties:
        preAuthToken: { type: string }
        deliveryTarget:
          type: string
          description: Phone number or notification address to route through external gateway

    MfaVerifyRequest:
      type: object
      required: [preAuthToken, passcode]
      properties:
        preAuthToken: { type: string }
        passcode: { type: string, minLength: 4, maxLength: 10 }

    MfaVerifyResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [AUTHENTICATED, REJECTED]
        token:
          type: string
          description: Final session token when authenticated

    ApiKeyCreateRequest:
      type: object
      required: [name, subjectType, subjectId]
      properties:
        name: { type: string }
        subjectType:
          type: string
          enum: [USER, SERVICE_ACCOUNT]
        subjectId: { type: string }

    ApiKeyResponse:
      allOf:
        - $ref: '#/components/schemas/ApiKeyMetadata'
        - type: object
          required: [apiKey]
          properties:
            apiKey:
              type: string
              description: Returned only at creation time

    ApiKeyMetadata:
      type: object
      required: [keyId, name, status, subjectType, subjectId]
      properties:
        keyId: { type: string }
        name: { type: string }
        status:
          type: string
          enum: [ACTIVE, REVOKED]
        subjectType:
          type: string
          enum: [USER, SERVICE_ACCOUNT]
        subjectId: { type: string }

    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [SUCCESS, LOGGED_OUT, PASSWORD_CHANGED, RESET_REQUESTED, RESET_CONFIRMED, PASSWORD_RULES_UPDATED, MFA_CHALLENGE_SENT, API_KEY_REVOKED]

    DeterministicErrorResponse:
      type: object
      required: [status, code, reason]
      properties:
        status:
          type: string
          enum: [REJECTED]
        code:
          type: string
          enum:
            - DUPLICATE_ACCOUNT
            - INVALID_CREDENTIALS
            - PASSWORD_RULE_VIOLATION
            - INVALID_RESET_TOKEN
            - UNAUTHORIZED
            - NOT_FOUND
        reason: { type: string }
